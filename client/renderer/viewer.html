<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remote Session</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #050811;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Floating Toolbar */
    .viewer-toolbar {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(17, 24, 39, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-top: none;
      border-radius: 0 0 12px 12px;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 100;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
      transition: opacity 0.25s, transform 0.25s;
    }

    .toolbar-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .badge-live {
      background-color: #10b981;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      box-shadow: 0 0 6px #10b981;
    }

    .tool-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e5e7eb;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s;
    }

    .tool-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .tool-btn.active {
      background: #ef4444;
      color: white;
    }

    .btn-disconnect {
      background: #dc2626 !important;
      color: white !important;
      font-weight: bold;
    }

    /* Video Surface */
    .stream-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background-color: #000000;
      overflow: hidden;
    }

    #remote-video {
      max-width: 100%;
      max-height: 100%;
      width: 100%;
      height: 100%;
      object-fit: contain;
      cursor: default;
    }

    /* Chat Drawer */
    .chat-drawer {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 320px;
      background: #111827;
      border-left: 1px solid #374151;
      display: none;
      flex-direction: column;
      z-index: 90;
    }

    .chat-drawer.open {
      display: flex;
    }

    .chat-header {
      padding: 12px;
      border-bottom: 1px solid #374151;
      font-weight: bold;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
    }

    .chat-messages {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-msg {
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12.5px;
      max-width: 85%;
    }

    .chat-msg.me {
      background: #3b82f6;
      align-self: flex-end;
    }

    .chat-msg.them {
      background: #374151;
      align-self: flex-start;
    }

    .chat-input-bar {
      padding: 10px;
      border-top: 1px solid #374151;
      display: flex;
      gap: 6px;
    }

    .chat-input {
      flex: 1;
      background: #1f2937;
      border: 1px solid #4b5563;
      border-radius: 6px;
      color: white;
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
    }

    /* Loading Overlay */
    .status-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(5, 8, 17, 0.95);
      z-index: 50;
      gap: 16px;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(239, 68, 68, 0.2);
      border-top: 4px solid #ef4444;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Floating Top Bar -->
  <div class="viewer-toolbar" id="toolbar">
    <div class="toolbar-info">
      <div class="badge-live"></div>
      <span id="remote-label">Connecting...</span>
      <span id="stat-latency" style="color: #9ca3af; font-size: 11px; margin-left: 6px;">-- ms</span>
    </div>

    <button class="tool-btn active" id="btn-toggle-input" title="Toggle Remote Keyboard & Mouse">
      ⌨ Mouse & Keys: ON
    </button>
    <button class="tool-btn" id="btn-cad" title="Send Ctrl+Alt+Del">
      Ctrl+Alt+Del
    </button>
    <button class="tool-btn" id="btn-fit" title="Toggle Scaling Mode">
      Fit Screen
    </button>
    <button class="tool-btn" id="btn-fullscreen" title="Toggle Fullscreen">
      Fullscreen
    </button>
    <button class="tool-btn" id="btn-chat" title="Toggle In-Session Chat">
      Chat
    </button>
    <button class="tool-btn btn-disconnect" id="btn-disconnect">
      Disconnect
    </button>
  </div>

  <!-- Video Stream Canvas -->
  <div class="stream-container" id="stream-container">
    <div class="status-overlay" id="status-overlay">
      <div class="spinner"></div>
      <div id="status-msg" style="font-size: 16px; font-weight: 600;">Establishing encrypted WebRTC connection...</div>
    </div>
    <video id="remote-video" autoplay playsinline></video>
  </div>

  <!-- Chat Drawer -->
  <div class="chat-drawer" id="chat-drawer">
    <div class="chat-header">
      <span>Session Chat</span>
      <span id="btn-close-chat" style="cursor: pointer;">✕</span>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-bar">
      <input type="text" class="chat-input" id="chat-text" placeholder="Type message...">
      <button class="tool-btn" id="btn-send-chat" style="background:#3b82f6;">Send</button>
    </div>
  </div>

  <script src="viewer.js"></script>
</body>
</html>
